<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF4DC">
  <title>ストアへ移動します</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5WVMPG8EV6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5WVMPG8EV6');
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #FFF4DC;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Yu Gothic UI", Meiryo, sans-serif;
    }

    .redirect-visual {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      padding: 0 24px;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    h1 {
      width: 100%;
      margin: 0;
      color: #7A5037;
      font-size: clamp(26px, 7vw, 40px);
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .clarie {
      width: clamp(190px, 58vw, 280px);
      height: auto;
    }

    noscript a {
      position: fixed;
      right: 0;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 0;
      color: #7A5037;
      font-weight: 700;
      text-align: center;
    }
  </style>

  <script>
    (() => {
      const appStoreUrl = "https://itunes.apple.com/jp/app/id1551817951";
      const googlePlayUrl = "https://play.google.com/store/apps/details?id=com.YuukiHyodo.tamaire&pcampaignid=web_share";

      const userAgent = navigator.userAgent || "";
      const userAgentPlatform = navigator.userAgentData?.platform || "";
      const isAndroid = /Android/i.test(userAgent) || /Android/i.test(userAgentPlatform);
      const destination = isAndroid ? googlePlayUrl : appStoreUrl;

      let trackingComplete = false;
      let minimumDelayComplete = false;
      let redirected = false;

      const redirect = () => {
        if (redirected) return;
        redirected = true;
        window.location.replace(destination);
      };

      const redirectWhenReady = () => {
        if (trackingComplete && minimumDelayComplete) {
          redirect();
        }
      };

      gtag('event', 'store_redirect', {
        send_to: 'G-5WVMPG8EV6',
        store_platform: isAndroid ? 'google_play' : 'app_store',
        destination_url: destination,
        event_callback: () => {
          trackingComplete = true;
          redirectWhenReady();
        },
        event_timeout: 1000
      });

      window.setTimeout(() => {
        minimumDelayComplete = true;
        redirectWhenReady();
      }, 1200);

      // Ad blockers or network errors must not prevent the store redirect.
      window.setTimeout(redirect, 1800);
    })();
  </script>
</head>

<body>
  <main class="redirect-visual">
    <h1>ちょっとまってね</h1>
    <img class="clarie" src="./clarietamaire.png" alt="玉入れをするクラリィ">
  </main>

  <noscript>
    <a href="https://itunes.apple.com/jp/app/id1551817951">
      App Storeへ移動する
    </a>
  </noscript>
</body>
</html>
