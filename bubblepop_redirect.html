<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#84BFD1">
  <title>ストアへ移動します</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #84BFD1;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Yu Gothic UI", Meiryo, sans-serif;
    }

    .redirect-visual {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      padding: 0 24px;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(28px, 8vw, 46px);
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .clarie {
      width: clamp(180px, 52vw, 240px);
      height: auto;
    }

    noscript a {
      position: fixed;
      right: 0;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 0;
      color: #fff;
      font-weight: 700;
      text-align: center;
    }
  </style>

  <script>
    (() => {
      const appStoreUrl = "https://apps.apple.com/jp/app/クラリィのぷくぷくシャボン玉はこび/id6767833171";
      const googlePlayUrl = "https://play.google.com/store/apps/details?id=com.YuukiHyodo.bubblepop";

      const userAgent = navigator.userAgent || "";
      const userAgentPlatform = navigator.userAgentData?.platform || "";
      const isAndroid = /Android/i.test(userAgent) || /Android/i.test(userAgentPlatform);
      const destination = isAndroid ? googlePlayUrl : appStoreUrl;

      window.setTimeout(() => {
        window.location.replace(destination);
      }, 1200);
    })();
  </script>
</head>

<body>
  <main class="redirect-visual">
    <h1>ちょっとまってね</h1>
    <img class="clarie" src="./clarie.png" alt="クラリィ">
  </main>

  <noscript>
    <a href="https://apps.apple.com/jp/app/クラリィのぷくぷくシャボン玉はこび/id6767833171">
      App Storeへ移動する
    </a>
  </noscript>
</body>
</html>
